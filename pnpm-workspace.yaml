packages:
  - shared
  - client
  - server
  - plugins/*

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64

allowBuilds:
  better-sqlite3: true
  # Squirrel.Windows only; packaging targets NSIS.
  electron-winstaller: false
  # Optional msgpackr speedup; ships prebuilds.
  msgpackr-extract: false

# Security floors for transitive deps, each bounded to the fixed major.
overrides:
  # express 5.3.0 requires the fixed proxy-addr ^2.0.8 and qs ^6.16.0 (via @colyseus/core).
  'express@>=5.0.0 <5.3.0': '^5.3.0'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'sharp@<0.35.5': '^0.35.5'
  'undici@>=7.0.0 <7.30.1': '^7.30.1'
  'undici@>=6.0.0 <6.29.1': '^6.29.1'
  'fast-uri@>=3.0.0 <3.1.9': '^3.1.9'

# eslint-plugin-solid's @typescript-eslint helpers never load typescript under oxlint, so TS 7 meets their <6.1 peer.
peerDependencyRules:
  allowedVersions:
    '@typescript-eslint/utils>typescript': '7'
    '@typescript-eslint/typescript-estree>typescript': '7'
    '@typescript-eslint/project-service>typescript': '7'
    '@typescript-eslint/tsconfig-utils>typescript': '7'
