packages:
  - shared
  - client
  - server
  - plugins/*

supportedArchitectures:
  os:
    - win32
    - linux
    - darwin
  cpu:
    - x64
    - arm64

onlyBuiltDependencies:
  - better-sqlite3

# Security floors for transitive deps, each bounded to the fixed major.
overrides:
  # express 5.3.0 requires the fixed proxy-addr ^2.0.8 and qs ^6.16.0 (via @colyseus/core).
  'express@>=5.0.0 <5.3.0': '^5.3.0'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'source-map-js@>=1.0.0 <1.2.2': '^1.2.2'
  'sharp@<0.35.5': '^0.35.5'
