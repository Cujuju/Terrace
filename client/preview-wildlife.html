<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wildlife preview (throwaway)</title>
    <style>
      /* Same neutral studio backdrop as preview.html (structures) — this page
         exists only to screenshot one creature at a time in isolation, not to
         look like the game's own sky/water. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #808080;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- THROWAWAY preview harness, mirroring preview.html / previewStructures.ts
         for the structures plugin. Not part of the shipped app: reached only
         by navigating here directly, not linked from index.html, not
         registered in plugins/registry.ts. Renders exactly one wildlife
         species' model, chosen by this page's own query string — see
         previewWildlife.ts for the full contract. -->
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/previewWildlife.ts"></script>
  </body>
</html>
