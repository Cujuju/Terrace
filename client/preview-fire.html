<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fire preview (throwaway)</title>
    <style>
      /* Same neutral studio backdrop as preview-crops.html / preview.html — the
         four flame candidates are judged against one another, so the only thing
         that may differ between two screenshots is the flame. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #808080;
      }
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <!-- THROWAWAY preview harness for the four candidate flame renderers
         (plugins/fire/client/flames/), mirroring preview-crops.html. Not part
         of the shipped app: not linked from index.html, not registered in
         plugins/registry.ts. Draws burning TREES — the real flora models — so a
         flame is judged on the thing it consumes. See previewFire.ts for the
         query-string contract (?candidate, ?scene, ?t). -->
    <canvas id="viewport"></canvas>
    <script type="module" src="/src/previewFire.ts"></script>
  </body>
</html>
