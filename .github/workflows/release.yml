# Publishes the Windows installer and latest.yml as v<version>, then adds the macOS builds and latest-mac.yml to that release.
# Manual runs release main; a pushed tag must match its commit's version.
name: Release app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: app-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is counted from the whole git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0
        # pnpm version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron's download
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      # eslint-plugin-comment-budget is a private git dependency (see ci.yml).
      - name: authenticate the private git dependency
        shell: bash
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:$DEPS_TOKEN@github.com/".insteadOf "https://github.com/"
          else
            echo "::error::DEPS_TOKEN is unset; the private git dependency cannot be installed."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Check the version is unreleased, and a pushed tag names it
        id: version
        run: |
          $version = node scripts/print-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            Write-Error "Tag $env:GITHUB_REF_NAME is not this commit's version, $version. Delete it and tag the commit $tag."
            exit 1
          }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "$tag is already released. Commit something, then release again."
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          exit 0

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm dist

      - name: Publish the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # --target tags the commit just built (a dispatch's tag doesn't exist yet); a pushed tag already names it.
        run: |
          $installer = "release/Terrace-Setup-$env:VERSION.exe"
          gh release create "v$env:VERSION" $installer "$installer.blockmap" release/latest.yml `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Terrace $env:VERSION" --generate-notes
          exit $LASTEXITCODE

  release-mac:
    # After the Windows job: it makes the release these files join. Until they arrive a Mac finds no newer build and stays as it is.
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Builds are ad-hoc signed (client/electron-builder.ts); no certificate is looked for.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          # The version is counted from the whole git history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache Electron's download
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-

      - name: authenticate the private git dependency
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          if [ -n "$DEPS_TOKEN" ]; then
            git config --global url."https://x-access-token:$DEPS_TOKEN@github.com/".insteadOf "https://github.com/"
          else
            echo "::error::DEPS_TOKEN is unset; the private git dependency cannot be installed."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:mac

      - name: Add the macOS builds to the release
        # The same commit as the Windows job, so the same version.
        run: |
          version=$(node scripts/print-version.mjs)
          gh release upload "v$version" release/*.dmg release/*-mac.zip release/latest-mac.yml --repo "$GITHUB_REPOSITORY"
